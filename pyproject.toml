[project]
name = "python-mcp"
version = "0.1.0"
description = "Prompt-driven System File Manipulation powered by Ollama gpt-oss & MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.2.0",
    "ollama>=0.6.2",
    "rich>=13.0.0",
]

[project.scripts]
python-mcp = "python_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
